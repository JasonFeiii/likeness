<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Something is waiting in the dark. Let it see you.">
<title>Likeness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an almost black room. The face is the only lit thing, and only where a scanning light passes.
   One whispered line + one action at the bottom; a sparse instrument HUD in the corners.
   Single deliberate dark look: the effect depends on darkness, so colours are fixed, not theme-switched. */
:root {
  color-scheme: dark;
  --void: #030405;
  --fg: #dfe7e6;
  --fg-dim: rgba(223, 231, 230, 0.55);
  --fg-faint: rgba(223, 231, 230, 0.28);
  --beam: #c9f2e8;
  --edge: rgba(201, 242, 232, 0.18);
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--fg);
  font: 13px/1.5 var(--mono);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  cursor: default;
}
#flow, #glints { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#flow { z-index: 0; background: var(--void); }
#glints { z-index: 1; pointer-events: none; }

.hud {
  position: fixed; z-index: 2;
  font: 400 11px/1.6 var(--mono);
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--fg-faint);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.hud.tl { top: calc(18px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); }
.hud.tr { top: calc(18px + env(safe-area-inset-top, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); text-align: right; }
.hud.bl { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); }
.hud.br { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); text-align: right; }
.hud b { color: var(--fg-dim); font-weight: 500; }
.hud .live { color: var(--beam); }

.invite {
  position: fixed; z-index: 3;
  left: 50%; bottom: calc(12vh + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(560px, calc(100% - 32px));
  display: grid; justify-items: center; gap: 22px;
  text-align: center;
  transition: opacity 1.6s ease, transform 1.6s ease;
}
.invite.gone { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
.invite p {
  margin: 0;
  font: italic 400 clamp(24px, 4.2vw, 36px)/1.15 var(--serif);
  color: var(--fg);
  text-wrap: balance;
  letter-spacing: 0.005em;
}
.invite p span { color: var(--fg-dim); }
.row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
.eye {
  appearance: none; cursor: pointer;
  padding: 13px 22px; border-radius: 999px;
  border: 1px solid var(--edge);
  background: rgba(201, 242, 232, 0.06);
  color: var(--beam);
  font: 500 12px/1 var(--mono); letter-spacing: 0.18em; text-transform: uppercase;
  transition: background .3s, border-color .3s, box-shadow .3s;
}
.eye:hover { background: rgba(201, 242, 232, 0.12); border-color: rgba(201, 242, 232, 0.4); box-shadow: 0 0 30px rgba(201, 242, 232, 0.12); }
.eye[disabled] { opacity: .45; cursor: progress; }
.quiet {
  appearance: none; border: 0; background: none; cursor: pointer; padding: 6px 2px;
  color: var(--fg-faint);
  font: 400 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
  border-bottom: 1px solid transparent;
}
.quiet:hover { color: var(--fg-dim); border-bottom-color: var(--fg-faint); }
.note { margin: 0; font: 400 12px/1.5 var(--mono); color: var(--fg-dim); max-width: 46ch; letter-spacing: 0.02em; }

.close {
  position: fixed; z-index: 3;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
}
button:focus-visible { outline: 1px solid var(--beam); outline-offset: 4px; }

@media (max-width: 560px) {
  .hud.bl, .hud.br { display: none; }
  .invite { bottom: calc(9vh + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>


<canvas id="flow" aria-hidden="true"></canvas>
<canvas id="glints" aria-hidden="true"></canvas>

<div class="hud tl">Likeness<br><span id="hud-state">Dark room</span></div>
<div class="hud tr"><span id="hud-pass">Pass 00</span><br><span id="hud-pts">— / 468</span></div>
<div class="hud bl" id="hud-pose">Yaw +0°<br>Pitch +0°</div>
<div class="hud br">Nothing leaves<br>this browser</div>

<section class="invite" id="invite" aria-live="polite">
  <p>Something is waiting in the dark.<br><span>Let it see you.</span></p>
  <div class="row">
    <button class="eye" id="cam" type="button" disabled>Open the camera</button>
    <label class="quiet" for="file" tabindex="0">or offer a photo<input id="file" type="file" accept="image/*" hidden></label>
  </div>
  <p class="note" id="note" hidden></p>
</section>

<button class="quiet close" id="close" type="button" hidden>Close the eye</button>

    if (prog) {
      gl.useProgram(prog);
      const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      ['uRes','uTime','uLive','uFlick','uLines','uPhoto','uTexel','uBox','uKind','uDir','uPhase','uSpot','uOn'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
      tL = tex(); tP = tex(); gl.uniform1i(U.uLines, 0); gl.uniform1i(U.uPhoto, 1);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    }
  }

  const glints = $('glints'), gctx = glints.getContext('2d');
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
    const fw = Math.max(1, Math.floor(W * DPR * 0.75)), fh = Math.max(1, Math.floor(H * DPR * 0.75));
    if (canvas.width !== fw || canvas.height !== fh) { canvas.width = fw; canvas.height = fh; if (gl) gl.viewport(0, 0, fw, fh); }
    if (glints.width !== Math.floor(W * DPR) || glints.height !== Math.floor(H * DPR)) { glints.width = Math.floor(W * DPR); glints.height = Math.floor(H * DPR); }
    const lw = Math.max(2, Math.floor(W * LAYER)), lh = Math.max(2, Math.floor(H * LAYER));
    if (lines.width !== lw || lines.height !== lh) { lines.width = photo.width = lw; lines.height = photo.height = lh; }
  }
  window.addEventListener('resize', resize); resize();

  /* ======================= loop ======================= */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let visible = !document.hidden, lastHud = 0;
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; if (visible) requestAnimationFrame(loop); });
  const T0 = performance.now(), seed = Math.random() * 40;
  nextPass(0);

  function loop(now) {
    if (!visible) return;
    resize();
    const t = (now - T0) / 1000;
    if (state.mode === 'camera') track();

    const ghost = ghostScreen(t);
    let real = null;
    if (state.pts && state.mode !== 'ghost') {
      const target = frameFor(state.pts, state.mirror);
      if (!frame || frame.mx !== target.mx) frame = { ...target };
      else { frame.k += (target.k - frame.k) * 0.12; frame.tx += (target.tx - frame.tx) * 0.12; frame.ty += (target.ty - frame.ty) * 0.12; }
      real = new Float32Array(1404);
      for (let i = 0; i < 468; i++) { real[i*3] = frame.tx + frame.mx * frame.k * state.pts[i*3]; real[i*3+1] = frame.ty + frame.k * state.pts[i*3+1]; real[i*3+2] = frame.k * state.pts[i*3+2]; }
      if (state.shown && state.mode === 'camera') for (let i = 0; i < 1404; i++) real[i] = state.shown[i] + (real[i] - state.shown[i]) * 0.55;
      state.shown = real;
    }
    state.blend += ((real ? 1 : 0) - state.blend) * 0.05;
    let sp = ghost;
    if (state.shown && state.blend > 0.002) { sp = new Float32Array(1404); for (let i = 0; i < 1404; i++) sp[i] = ghost[i] + (state.shown[i] - ghost[i]) * state.blend; }

    drawLayers(sp, !!real);

    // face box (screen px) from the oval
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const i of C.oval) { x0 = Math.min(x0, sp[i*3]); x1 = Math.max(x1, sp[i*3]); y0 = Math.min(y0, sp[i*3+1]); y1 = Math.max(y1, sp[i*3+1]); }
    const bc = [(x0 + x1) / 2, (y0 + y1) / 2], bh = [(x1 - x0) / 2 * 1.15, (y1 - y0) / 2 * 1.1];

    // scanner timing
    let el = t - scan.start;
    if (el > scan.dur + scan.gap) { nextPass(t); el = 0; }
    const on = el < scan.dur ? Math.min(1, el / 0.25, (scan.dur - el) / 0.35) : 0;
    const phase = reduce.matches ? 0.5 : Math.min(1, el / scan.dur);
    const ease = phase < 0.5 ? 2 * phase * phase : 1 - Math.pow(-2 * phase + 2, 2) / 2;
    const spot = [Math.sin(el * 0.9 + scan.seed) * 0.55, Math.cos(el * 0.7 + scan.seed * 1.7) * 0.6];
    const rakeA = scan.seed + el * 0.6;
    const dir = scan.kind === 2 ? [Math.cos(rakeA), Math.sin(rakeA)] : scan.dir;
    const fl = reduce.matches ? 0.9 : flicker(t);
    // the passive room is dimmer than a room with someone in it
    const presence = 0.55 + 0.45 * state.blend;

    // glints: landmark points catch the band as it crosses them
    gctx.setTransform(1, 0, 0, 1, 0, 0); gctx.clearRect(0, 0, glints.width, glints.height);
    if (on > 0.01) {
      gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const c = -1.5 + 3 * ease;
      for (let i = 0; i < 468; i++) {
        let dx = (sp[i*3] - bc[0]) / bh[0], dy = -(sp[i*3+1] - bc[1]) / bh[1];
        dx *= bh[0] / bh[1];
        let g;
        if (scan.kind === 0) { const s = dx * dir[0] + dy * dir[1]; g = Math.exp(-Math.pow((s - c) / 0.05, 2)); }
        else if (scan.kind === 1) { const dd = Math.hypot(dx - spot[0], dy - spot[1]); g = Math.exp(-Math.pow((dd - 0.42) / 0.05, 2)) * 0.6; }
        else { g = 0; }
        if (g < 0.04) continue;
        gctx.fillStyle = 'rgba(214,248,238,' + (g * on * fl * presence * 0.9).toFixed(3) + ')';
        gctx.fillRect(sp[i*3] - 0.8, sp[i*3+1] - 0.8, 1.6, 1.6);
      }
    }

    if (prog) {
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tL); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, lines);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tP); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, photo);
      gl.uniform2f(U.uRes, canvas.width, canvas.height);
      gl.uniform2f(U.uTexel, 1 / lines.width, 1 / lines.height);
      gl.uniform1f(U.uTime, seed + t * (reduce.matches ? 0.15 : 1));
      gl.uniform1f(U.uLive, state.blend);
      gl.uniform1f(U.uFlick, fl * presence);
      gl.uniform4f(U.uBox, bc[0] / W, 1 - bc[1] / H, bh[0] / W, bh[1] / H);
      gl.uniform1f(U.uKind, scan.kind);
      gl.uniform2f(U.uDir, dir[0], dir[1]);
      gl.uniform1f(U.uPhase, ease);
      gl.uniform2f(U.uSpot, spot[0], spot[1]);
      gl.uniform1f(U.uOn, on);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    if (now - lastHud > 200) {
      lastHud = now;
      const kinds = ['Band', 'Lamp', 'Raking'];
      const found = state.mode !== 'ghost' && !!state.pts;
      $('hud-state').innerHTML = state.mode === 'ghost' ? 'Dark room' : found ? '<span class="live">Subject present</span>' : 'Searching';
      $('hud-pass').textContent = 'Pass ' + String(scan.n).padStart(2, '0') + ' · ' + (on > 0 ? kinds[scan.kind] : 'Dark');
      $('hud-pts').textContent = (found ? '468' : '—') + ' / 468';
      const ps = pose(found ? state.pts : sp);
      const sg = v => (v >= 0 ? '+' : '') + v + '°';
      $('hud-pose').innerHTML = 'Yaw ' + sg(ps.yaw) + '<br>Pitch ' + sg(ps.pitch);
    }

    if (reduce.matches && state.mode !== 'camera') setTimeout(() => requestAnimationFrame(loop), 120);
    else requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  loadModels().then(() => { $('cam').disabled = false; })
    .catch(e => { console.error(e); note('The watcher could not wake: the face model failed to load. Reload to try again.'); });
})();
</script>

</body>
</html>
